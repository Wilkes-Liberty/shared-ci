name: Release

# Publishes a GitHub Release for a v* tag, with notes taken from the caller's
# CHANGELOG.md. One implementation for every repository in the organization.
#
# Why this exists
# ---------------
# Without it the evidence that a change shipped is spread across three places
# an auditor has to correlate: an annotated tag whose notes are only readable
# via `git tag -l --format='%(contents)'`, a CHANGELOG section in the repo at
# that commit, and a workflow run log that ages out. NIST 800-171 3.4.3 (track,
# review, approve and log changes) was carried by `git log` alone, which records
# commits rather than what reached production and when. A Release is one
# timestamped artifact bound to a commit, notes inline, actor recorded.
#
# Why shared rather than per-repo
# -------------------------------
# `infra` proved this workflow, and for a while it was the only repository that
# had it: on 2026-08-11 `webcms` had 6 Releases against 82 final tags and `ui`
# had 3 against 58, so `releases/latest` for both pointed at versions from
# months earlier. Copying infra's file into each repository would have fixed
# that and started the same drift the attribution workflow already exists to
# end. This is the single copy; callers stay thin.
#
# Why the CHANGELOG extraction is inlined here rather than calling a script
# ------------------------------------------------------------------------
# infra carries `scripts/changelog-section.sh`; webcms and ui do not. A reusable
# workflow runs against the CALLER's checkout, so a script dependency would mean
# shipping that script to every repository — three copies of the thing this file
# exists to have one of. The awk below is that script's logic, unchanged in
# behaviour, with both of its failure modes preserved.
#
# Notes are GENERATED FROM the CHANGELOG, never duplicated into the release body
# by hand — one canonical record, so drift is impossible.
#
# Injection posture: nothing from the event payload reaches a `run:` body. The
# only `${{ }}` values used are the caller input and the job token, both passed
# through `env:`; the tag is read from $GITHUB_REF_NAME as a shell variable and
# quoted at every use.
#
# This deploys nothing. Deploys are driven separately by each repository's
# deploy workflows on the same v* tag.

on:
  workflow_call:
    inputs:
      changelog-path:
        description: >-
          Path to the CHANGELOG in the calling repository. It must use
          Keep a Changelog headings: `## [MAJOR.MINOR.PATCH]` (an optional
          ` - YYYY-MM-DD` suffix is fine) for finals. An RC prefers
          `## [Unreleased]`; if that heading is missing or empty it falls
          back to the versioned `## [X.Y.Z]` section for the series. A tag
          with no usable heading, or a heading with nothing under it, fails
          the run rather than publishing an empty Release.
        type: string
        default: CHANGELOG.md
      fragments-dir:
        description: Pending fragment directory. Final releases require compiled fragments.
        type: string
        default: changelog.d
      extra-sections:
        description: Additional fragment sections, matching the changelog checker.
        type: string
        default: ''
      preserve-history:
        description: Preserve historical archive formatting during an RC fragment preview.
        type: boolean
        default: false
      allow-initial-release:
        description: Allow an RC preview before the first versioned changelog archive exists.
        type: boolean
        default: false

permissions:
  contents: write # required to create the Release

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything that is not a v* release tag
        # The header says this publishes Releases for v* tags; nothing enforced
        # it. A caller can invoke a reusable workflow from any trigger, so a
        # branch push or a stray tag would have reached `gh release create`
        # with that ref as the tag name. Fail here, loudly, rather than
        # publishing something nobody meant to release.
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "ERROR: expected a tag; the caller invoked this on ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'." >&2
            echo "Trigger this workflow from 'on: push: tags: [v*]' only." >&2
            exit 1
          fi
          python3 -I <<'PY'
          import os
          import re
          tag = os.environ["GITHUB_REF_NAME"]
          version = r"(?:0|[1-9][0-9]*)"
          match = re.fullmatch(
              rf"v{version}\.{version}\.{version}(?:-([0-9A-Za-z.-]+))?", tag
          )
          if not match:
              raise SystemExit("ERROR: expected vMAJOR.MINOR.PATCH[-prerelease]")
          suffix = match.group(1)
          if suffix and any(not part or (part.isdigit() and len(part) > 1 and part[0] == "0")
                            for part in suffix.split(".")):
              raise SystemExit("ERROR: invalid prerelease identifier")
          PY

      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          # The CHANGELOG is read at the tagged commit, not at the default
          # branch: an RC ships the notes that existed when it was cut.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Extract release notes from the CHANGELOG
        env:
          CHANGELOG: ${{ inputs.changelog-path }}
          FRAGMENTS_DIR: ${{ inputs.fragments-dir }}
          EXTRA_SECTIONS: ${{ inputs.extra-sections }}
          ALLOW_INITIAL_RELEASE: ${{ inputs.allow-initial-release }}
          PRESERVE_HISTORY: ${{ inputs.preserve-history }}
          SCRIPTS_REF: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          [ -r "$CHANGELOG" ] || { echo "ERROR: cannot read ${CHANGELOG}" >&2; exit 2; }

          # Final notes must already be compiled. RCs render a read-only preview
          # from the exact shared workflow revision so pending entries are kept.
          pending=$(python3 -I <<'PY'
          import os
          from pathlib import Path
          directory = Path(os.environ["FRAGMENTS_DIR"])
          if directory.is_symlink() or (directory.exists() and not directory.is_dir()):
              raise SystemExit("Fragment path must be a real directory")
          print("yes" if directory.exists() and any(
              not item.name.startswith(".") for item in directory.iterdir()
          ) else "no")
          PY
          )
          if [ "$pending" = "yes" ]; then
            case "$TAG" in
              *-rc.*)
                : "${SCRIPTS_REF:?Cannot locate the trusted fragment compiler}"
                compiler="$RUNNER_TEMP/release-changelog.py"
                gh api "repos/Wilkes-Liberty/shared-ci/contents/.github/scripts/changelog-fragments.py?ref=${SCRIPTS_REF}" \
                  -H "Accept: application/vnd.github.raw" > "$compiler"
                test -s "$compiler"
                series="${TAG#v}"
                series="${series%%-rc.*}"
                args=(render --changelog "$CHANGELOG" --fragments "$FRAGMENTS_DIR"
                      --version "$series" --date "$(date -u +%F)"
                      --extra-sections "${EXTRA_SECTIONS:-}")
                if [ "${ALLOW_INITIAL_RELEASE:-false}" = "true" ]; then
                  args+=(--allow-initial-release)
                fi
                if [ "${PRESERVE_HISTORY:-false}" = "true" ]; then
                  args+=(--preserve-history)
                fi
                preview="$RUNNER_TEMP/release-changelog-preview.md"
                python3 -I "$compiler" "${args[@]}" > "$preview"
                CHANGELOG="$preview"
                ;;
              *)
                echo "ERROR: pending fragments must be compiled in the release-finalize commit before tagging." >&2
                exit 1
                ;;
            esac
          fi

          # Literal prefix match, not a regex: the heading contains [ and ],
          # which would be a character class.
          extract_section() {
            awk -v want="$1" '
              index($0, want) == 1 { inside = 1; print; next }
              inside && /^## / { exit }
              inside { print }
            ' "$CHANGELOG"
          }
          section_body() {
            printf '%s\n' "$1" | python3 -I -c '
          import re, sys
          body = "\n".join(sys.stdin.read().splitlines()[1:])
          body = re.sub(r"<!--[\s\S]*?-->", "", body)
          print("\n".join(line for line in body.splitlines()
                          if line.strip() and not re.match(r"^\s*#{1,6}(?:\s|$)", line)
                          and not re.match(r"^\s*\[[^]]+\]:", line)))'
          }

          # An RC prefers [Unreleased]: these repositories do not relabel
          # the CHANGELOG until the final release, so at RC time the notes
          # for the work being shipped still live there. Relabelling at RC
          # time would leave nothing to finalize, and a rejected RC would
          # need it undone.
          #
          # If [Unreleased] is missing or empty — the changelog was
          # finalized before the candidate — fall back to ## [X.Y.Z] for
          # the series so the Release still publishes. webcms v1.49.1-rc.1
          # (2026-08-14) failed here after that invert.
          case "$TAG" in
            *-rc.*)
              HEADING='## [Unreleased]'
              section="$(extract_section "$HEADING")"
              body="$(section_body "$section")"
              if [ -z "$body" ]; then
                series="${TAG#v}"
                series="${series%%-rc.*}"
                HEADING="## [${series}]"
                echo "WARN: [Unreleased] is missing or empty; falling back to ${HEADING}" >&2
                section="$(extract_section "$HEADING")"
                body="$(section_body "$section")"
              fi
              ;;
            *)
              HEADING="## [${TAG#v}]"
              section="$(extract_section "$HEADING")"
              body="$(section_body "$section")"
              ;;
          esac

          [ -n "$section" ] || {
            echo "ERROR: no '${HEADING}' section found in ${CHANGELOG}" >&2
            exit 1
          }

          # A heading with nothing under it means the notes were never written.
          # Publishing that empty is the "success that didn't happen" shape —
          # a green run and a Releases page that documents nothing.
          [ -n "$body" ] || {
            echo "ERROR: '${HEADING}' section in ${CHANGELOG} is empty" >&2
            exit 1
          }

          printf '%s\n' "$section" > /tmp/release-notes.md
          echo "Extracted $(wc -l < /tmp/release-notes.md) lines for ${TAG}:"
          head -5 /tmp/release-notes.md

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # Every accepted prerelease suffix is marked, separating it from
          # finals and ensuring `releases/latest` — which excludes
          # prereleases — keeps resolving to the newest FINAL. Sibling deploys
          # pin infra by that endpoint, so mislabelling an RC here would change
          # what other repositories deploy with.
          PRERELEASE="--prerelease=false"
          case "$TAG" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          # Idempotent: re-running on an existing tag updates the notes instead
          # of failing. Re-tagging is rare, but a red X on a release that
          # already published would be misleading.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — updating notes."
            gh release edit "$TAG" \
              --notes-file /tmp/release-notes.md \
              $PRERELEASE
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              --verify-tag \
              $PRERELEASE
          fi

          echo "Published: $(gh release view "$TAG" --json url --jq .url)"
