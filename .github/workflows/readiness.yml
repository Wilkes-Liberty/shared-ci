name: PR readiness

# Reference caller for the shared readiness diagnostic. The implementation
# lives in pr-readiness.yml and check-pr-readiness.py. This file uses a
# relative path so the reference exercises the commit under test. Other
# repositories call the tagged copy:
#
#   jobs:
#     readiness:
#       uses: Wilkes-Liberty/shared-ci/.github/workflows/pr-readiness.yml@v1
#
# check_suite is optional coverage for a Copilot-gated action_required
# suite after jobs would otherwise look green. The job-level filter in
# the reusable workflow prevents this caller from looping on its own
# completion. Do not add logic here.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  check_suite:
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: read

jobs:
  readiness:
    uses: ./.github/workflows/pr-readiness.yml
