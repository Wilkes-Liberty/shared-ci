name: Terminology

# Reference caller for the shared warn-only operator-terminology lint. The
# implementation lives in operator-terms.yml and check-operator-terms.py.
# This file uses a relative path so the reference exercises the commit under
# test. Other repositories call the tagged copy:
#
#   jobs:
#     operator-terms:
#       uses: Wilkes-Liberty/shared-ci/.github/workflows/operator-terms.yml@v1
#
# Do not add logic here.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  operator-terms:
    uses: ./.github/workflows/operator-terms.yml
