name: Operator terminology

# Warn-only lint: flags "human(s)" used for people in Markdown, prompts and
# .github/** files. Standing rule: refer to people as operator(s), never
# human(s). Annotations only; the job does not fail. The allowlist (for
# "human-readable", "Human Resources", identifiers such as `needs-human`,
# third-party quotes, and lines marked `operator-terminology: allow`) lives in
# check-operator-terms.py.
#
# Callers:
#   jobs:
#     operator-terms:
#       uses: Wilkes-Liberty/shared-ci/.github/workflows/operator-terms.yml@v1
#
# The script is fetched from this repository at the commit this workflow
# resolved to, never from the repository under review.

on:
  # Reusable only. The script's own behaviour is pinned by
  # tests/test_check_operator_terms.py in the Tests workflow.
  workflow_call:

permissions:
  contents: read

jobs:
  operator-terms:
    name: Operator terminology (warn-only)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository under review
        uses: actions/checkout@v7
      - name: Fetch the lint script from shared-ci
        uses: actions/checkout@v7
        with:
          repository: Wilkes-Liberty/shared-ci
          ref: ${{ job.workflow_sha }}
          path: .shared-ci
          sparse-checkout: .github/scripts/check-operator-terms.py
          sparse-checkout-cone-mode: false
      - name: Scan
        run: |
          python3 .shared-ci/.github/scripts/check-operator-terms.py \
            $(git ls-files | grep -v '^\.shared-ci/')
